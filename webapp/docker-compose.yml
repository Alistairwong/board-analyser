services:
  climb-search:
    build: .
    container_name: climb-search
    restart: unless-stopped
    ports:
      - "8010:8000"          # http://nas-server:8010 on your network
    volumes:
      - ../data:/app/data    # shared with video/; tension.db and exported climbs live here
    env_file:
      - path: .env           # TENSION_USERNAME / TENSION_PASSWORD for syncing new climbs
        required: false
